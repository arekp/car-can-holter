<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Car CAN Holter – podłączenie do Forda Focusa Mk2</text>

  <!-- AUTO -->
  <rect x="20" y="60" width="330" height="520" rx="14" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="185" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#374151">AUTO</text>

  <!-- OBD socket -->
  <text x="185" y="122" text-anchor="middle" font-weight="bold" fill="#1f2937">① Gniazdo OBD-II</text>
  <text x="185" y="140" text-anchor="middle" font-size="12" fill="#6b7280">pod deską, strona kierowcy (pod kolumną kierownicy)</text>
  <path d="M45 155 H325 L300 255 H70 Z" fill="#111827"/>
  <g font-size="12" fill="#ffffff" text-anchor="middle">
    <circle cx="75" cy="185" r="11" fill="#4b5563"/><text x="75" y="189">1</text>
    <circle cx="108" cy="185" r="11" fill="#4b5563"/><text x="108" y="189">2</text>
    <circle cx="141" cy="185" r="11" fill="#2563eb"/><text x="141" y="189">3</text>
    <circle cx="174" cy="185" r="11" fill="#4b5563"/><text x="174" y="189">4</text>
    <circle cx="207" cy="185" r="11" fill="#16a34a"/><text x="207" y="189">5</text>
    <circle cx="240" cy="185" r="11" fill="#ea580c"/><text x="240" y="189">6</text>
    <circle cx="273" cy="185" r="11" fill="#4b5563"/><text x="273" y="189">7</text>
    <circle cx="306" cy="185" r="11" fill="#4b5563"/><text x="306" y="189">8</text>
    <circle cx="90" cy="225" r="11" fill="#4b5563"/><text x="90" y="229">9</text>
    <circle cx="119" cy="225" r="11" fill="#4b5563"/><text x="119" y="229">10</text>
    <circle cx="148" cy="225" r="11" fill="#2563eb"/><text x="148" y="229">11</text>
    <circle cx="177" cy="225" r="11" fill="#4b5563"/><text x="177" y="229">12</text>
    <circle cx="206" cy="225" r="11" fill="#4b5563"/><text x="206" y="229">13</text>
    <circle cx="235" cy="225" r="11" fill="#ea580c"/><text x="235" y="229">14</text>
    <circle cx="264" cy="225" r="11" fill="#4b5563"/><text x="264" y="229">15</text>
    <circle cx="293" cy="225" r="11" fill="#dc2626"/><text x="293" y="229">16</text>
  </g>

  <g font-size="13" fill="#1f2937">
    <circle cx="50" cy="285" r="7" fill="#2563eb"/><text x="64" y="290">3 / 11 – MS-CAN H/L (125 kbit/s)</text>
    <circle cx="50" cy="310" r="7" fill="#ea580c"/><text x="64" y="315">6 / 14 – HS-CAN H/L (500 kbit/s)</text>
    <circle cx="50" cy="335" r="7" fill="#16a34a"/><text x="64" y="340">5 – masa sygnałowa</text>
    <circle cx="50" cy="360" r="7" fill="#dc2626"/><text x="64" y="365">16 – +12 V stałe (tylko pomiar!)</text>
  </g>
  <text x="185" y="390" text-anchor="middle" font-size="11" fill="#6b7280">numery pinów są wytłoczone przy stykach</text>

  <!-- Lighter socket -->
  <text x="185" y="432" text-anchor="middle" font-weight="bold" fill="#1f2937">② Gniazdo zapalniczki</text>
  <text x="185" y="450" text-anchor="middle" font-size="12" fill="#6b7280">musi mieć 0 V po wyjęciu kluczyka</text>
  <circle cx="185" cy="510" r="44" fill="#111827"/>
  <circle cx="185" cy="510" r="30" fill="#374151"/>
  <circle cx="185" cy="510" r="8" fill="#f59e0b"/>

  <!-- Y splitter -->
  <rect x="380" y="150" width="150" height="100" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="455" y="178" text-anchor="middle" font-weight="bold" fill="#3730a3">Rozgałęźnik</text>
  <text x="455" y="196" text-anchor="middle" font-weight="bold" fill="#3730a3">OBD (Y)</text>
  <text x="455" y="218" text-anchor="middle" font-size="12" fill="#4b5563">wtyk męski → 2 gniazda</text>
  <text x="455" y="236" text-anchor="middle" font-size="12" fill="#4b5563">(wszystkie 16 pinów)</text>
  <line x1="320" y1="205" x2="380" y2="200" stroke="#6366f1" stroke-width="6"/>
  <!-- free socket -->
  <rect x="400" y="275" width="110" height="46" rx="8" fill="#ffffff" stroke="#6366f1" stroke-dasharray="5 4"/>
  <text x="455" y="295" text-anchor="middle" font-size="12" fill="#4b5563">wolne gniazdo</text>
  <text x="455" y="311" text-anchor="middle" font-size="12" fill="#4b5563">FORScan / ELM327</text>
  <line x1="455" y1="250" x2="455" y2="275" stroke="#6366f1" stroke-width="4"/>

  <!-- USB charger + powerbank -->
  <rect x="380" y="480" width="150" height="60" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="455" y="505" text-anchor="middle" font-weight="bold" fill="#92400e">Ładowarka USB</text>
  <text x="455" y="523" text-anchor="middle" font-size="12" fill="#4b5563">12 V → 5 V</text>
  <line x1="229" y1="510" x2="380" y2="510" stroke="#f59e0b" stroke-width="5"/>
  <rect x="580" y="480" width="150" height="60" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="655" y="505" text-anchor="middle" font-weight="bold" fill="#92400e">Powerbank</text>
  <text x="655" y="523" text-anchor="middle" font-size="12" fill="#4b5563">always-on, pass-through</text>
  <line x1="530" y1="510" x2="580" y2="510" stroke="#f59e0b" stroke-width="4"/>
  <text x="555" y="500" text-anchor="middle" font-size="11" fill="#92400e">USB</text>

  <!-- HOLTER -->
  <rect x="580" y="60" width="360" height="390" rx="14" fill="#ecfdf5" stroke="#10b981"/>
  <text x="760" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#065f46">HOLTER</text>

  <rect x="600" y="105" width="150" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="675" y="128" text-anchor="middle" font-weight="bold" fill="#1e3a8a">SN65HVD230</text>
  <text x="675" y="146" text-anchor="middle" font-size="12" fill="#4b5563">MS-CAN</text>

  <rect x="600" y="180" width="150" height="56" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="675" y="203" text-anchor="middle" font-weight="bold" fill="#9a3412">MCP2515</text>
  <text x="675" y="221" text-anchor="middle" font-size="12" fill="#4b5563">HS-CAN</text>

  <rect x="600" y="255" width="150" height="70" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="675" y="276" text-anchor="middle" font-weight="bold" fill="#991b1b">Bezpiecznik 0,5 A</text>
  <text x="675" y="294" text-anchor="middle" font-size="12" fill="#4b5563">dzielnik 1 MΩ / 220 kΩ</text>
  <text x="675" y="312" text-anchor="middle" font-size="12" fill="#4b5563">→ ADS1115</text>

  <rect x="790" y="150" width="130" height="190" rx="10" fill="#065f46"/>
  <text x="855" y="235" text-anchor="middle" font-weight="bold" font-size="17" fill="#ffffff">ESP32-S3</text>
  <text x="855" y="256" text-anchor="middle" font-size="12" fill="#d1fae5">+ microSD + RTC</text>
  <line x1="750" y1="133" x2="790" y2="180" stroke="#2563eb" stroke-width="3"/>
  <line x1="750" y1="208" x2="790" y2="215" stroke="#ea580c" stroke-width="3"/>
  <line x1="750" y1="290" x2="790" y2="290" stroke="#dc2626" stroke-width="3"/>

  <line x1="750" y1="370" x2="820" y2="340" stroke="#16a34a" stroke-width="3"/>
  <rect x="600" y="350" width="150" height="40" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="675" y="375" text-anchor="middle" font-weight="bold" fill="#166534">GND wspólna</text>

  <!-- wires splitter -> holter -->
  <path d="M530 170 C560 170 570 133 600 133" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M530 195 C560 195 570 208 600 208" fill="none" stroke="#ea580c" stroke-width="4"/>
  <path d="M530 220 C565 220 565 290 600 290" fill="none" stroke="#dc2626" stroke-width="3"/>
  <path d="M530 240 C560 240 560 370 600 370" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="545" y="140" font-size="11" fill="#1e3a8a">3/11</text>
  <text x="545" y="265" font-size="11" fill="#991b1b">16</text>
  <text x="545" y="340" font-size="11" fill="#166534">5</text>
  <text x="545" y="190" font-size="11" fill="#9a3412">6/14</text>

  <!-- powerbank -> esp -->
  <path d="M730 510 C800 510 855 450 855 340" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <text x="868" y="400" font-size="12" fill="#92400e">USB 5 V</text>

  <text x="760" y="425" text-anchor="middle" font-size="12" fill="#065f46">obie magistrale: tylko nasłuch (listen-only)</text>
  <text x="760" y="441" text-anchor="middle" font-size="12" fill="#065f46">terminacje 120 Ω na modułach zdjęte</text>
</svg>
