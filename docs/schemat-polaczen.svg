<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .card { fill: #ffffff; stroke: #2d3a4a; stroke-width: 2; }
      .title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .label { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 12px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .pin { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .wire { stroke: #2563eb; stroke-width: 3; fill: none; stroke-linecap: round; }
      .wire2 { stroke: #16a34a; stroke-width: 3; fill: none; stroke-linecap: round; }
      .gnd { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .can { stroke: #dc2626; stroke-width: 4; fill: none; }
      .term { stroke: #111827; stroke-width: 2; fill: none; }
      .led { fill: #facc15; stroke: #b45309; stroke-width: 2; }
      .btn { fill: #eeeeee; stroke: #666666; stroke-width: 2; }
      .note { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="900" />

  <!-- ESP32 -->
  <g id="esp32" transform="translate(40,120)">
    <rect class="card" x="0" y="0" width="330" height="260" rx="10" />
    <text x="18" y="30" class="title">ESP32 (WROOM)</text>
    <text x="18" y="60" class="label">Zasilanie:</text>
    <text x="18" y="82" class="pin">3.3V</text>
    <text x="18" y="106" class="pin">GND</text>

    <text x="170" y="60" class="label">SPI / CAN:</text>
    <text x="170" y="82" class="pin">GPIO18 → SCK</text>
    <text x="170" y="106" class="pin">GPIO23 → MOSI</text>
    <text x="170" y="130" class="pin">GPIO19 ← MISO</text>
    <text x="170" y="154" class="pin">GPIO5  → CS</text>
    <text x="170" y="178" class="pin">GPIO4  ← INT</text>

    <text x="18" y="150" class="label">Nowe wejścia/wyjścia:</text>
    <text x="18" y="178" class="pin">GPIO25 → LED</text>
    <text x="18" y="202" class="pin">GPIO26 ← PRZYCISK</text>
  </g>

  <!-- MCP2515 -->
  <g id="mcp2515" transform="translate(430,80)">
    <rect class="card" x="0" y="0" width="330" height="280" rx="10" />
    <text x="18" y="30" class="title">MCP2515 – CAN controller</text>
    <text x="18" y="60" class="label">Zasilanie:</text>
    <text x="18" y="82" class="pin">VCC → 3.3V</text>
    <text x="18" y="106" class="pin">GND → GND</text>

    <text x="18" y="150" class="label">SPI:</text>
    <text x="18" y="172" class="pin">SCK</text>
    <text x="18" y="196" class="pin">SI (MOSI)</text>
    <text x="18" y="220" class="pin">SO (MISO)</text>
    <text x="18" y="244" class="pin">CS</text>
    <text x="18" y="268" class="pin">INT</text>

    <text x="200" y="150" class="label">CAN interface:</text>
    <text x="200" y="172" class="pin">TXD</text>
    <text x="200" y="196" class="pin">RXD</text>
    <text x="200" y="220" class="pin">OSC 8 MHz</text>
    <text x="200" y="244" class="pin">RESET (opcjonalnie)</text>
  </g>

  <!-- CAN transceiver -->
  <g id="transceiver" transform="translate(840,90)">
    <rect class="card" x="0" y="0" width="270" height="220" rx="10" />
    <text x="18" y="30" class="title">CAN transceiver</text>
    <text x="18" y="60" class="label">np. SN65HVD230</text>
    <text x="18" y="90" class="pin">VCC → 3.3V</text>
    <text x="18" y="116" class="pin">GND → GND</text>
    <text x="18" y="142" class="pin">TXD → MCP2515 TXD</text>
    <text x="18" y="168" class="pin">RXD ← MCP2515 RXD</text>
    <text x="18" y="194" class="pin">CANH / CANL → magistrala CAN</text>
  </g>

  <!-- LED -->
  <g id="led" transform="translate(410,470)">
    <text x="0" y="0" class="label">Lampka / LED</text>
    <path class="wire2" d="M120 20 L170 20" />
    <rect x="170" y="12" width="48" height="16" fill="#d1d5db" stroke="#4b5563" stroke-width="1.5" />
    <circle cx="110" cy="20" r="18" class="led" />
    <path class="wire2" d="M92 20 L0 20" />
    <text x="0" y="52" class="small">GPIO25 → 330Ω → LED → GND</text>
  </g>

  <!-- Button -->
  <g id="button" transform="translate(700,470)">
    <text x="0" y="0" class="label">Przycisk</text>
    <rect x="0" y="20" width="130" height="40" class="btn" />
    <text x="25" y="48" class="small">PRZYCISK</text>
    <path class="wire2" d="M130 40 L200 40" />
    <text x="205" y="45" class="small">GPIO26</text>
    <path class="gnd" d="M65 60 L65 95" />
    <text x="0" y="112" class="small">spółka do GND po naciśnięciu</text>
    <text x="0" y="128" class="small">R pull-up 10kΩ do 3.3V</text>
  </g>

  <!-- Wires: ESP32 to MCP2515 -->
  <g id="esp-to-mcp">
    <path class="wire" d="M370 200 C400 200, 410 200, 430 200" />
    <text x="380" y="186" class="small">GPIO18 → SCK</text>

    <path class="wire" d="M370 220 C400 220, 410 220, 430 220" />
    <text x="380" y="206" class="small">GPIO23 → MOSI</text>

    <path class="wire" d="M370 240 C400 240, 410 240, 430 240" />
    <text x="380" y="226" class="small">GPIO19 ← MISO</text>

    <path class="wire" d="M370 260 C400 260, 410 260, 430 260" />
    <text x="380" y="246" class="small">GPIO5 → CS</text>

    <path class="wire" d="M370 280 C400 280, 410 280, 430 280" />
    <text x="380" y="266" class="small">GPIO4 ← INT</text>

    <path class="gnd" d="M110 380 L110 430 C110 440, 110 440, 150 440" />
    <text x="40" y="430" class="small">GND wspólne</text>
    <path class="gnd" d="M250 380 L250 435 C250 445, 250 445, 220 445" />
  </g>

  <!-- Power lines -->
  <g id="power">
    <path class="wire" d="M100 160 L180 160 C220 160, 220 150, 230 150" />
    <path class="wire" d="M100 180 L170 180 C220 180, 220 170, 230 170" />
    <text x="100" y="150" class="small">3.3V</text>
    <text x="100" y="205" class="small">GND</text>
    <path class="gnd" d="M100 200 L170 200 C220 200, 220 200, 230 200" />
  </g>

  <!-- MCP to transceiver -->
  <g id="mcp-to-trans">
    <path class="wire" d="M760 170 C820 170, 820 150, 840 150" />
    <text x="780" y="160" class="small">TXD →</text>
    <path class="wire" d="M760 210 C820 210, 820 180, 840 180" />
    <text x="780" y="200" class="small">RXD ←</text>
  </g>

  <!-- CAN bus -->
  <g id="canbus">
    <text x="1080" y="430" class="label">Magistrala CAN</text>
    <line x1="980" y1="470" x2="1380" y2="470" class="can" />
    <line x1="980" y1="520" x2="1380" y2="520" class="can" />
    <text x="900" y="470" class="small">CANH</text>
    <text x="900" y="520" class="small">CANL</text>

    <g transform="translate(980,470)">
      <line x1="0" y1="0" x2="0" y2="50" class="term" />
      <text x="8" y="26" class="small">120Ω</text>
    </g>
    <g transform="translate(1380,470)">
      <line x1="0" y1="0" x2="0" y2="50" class="term" />
      <text x="8" y="26" class="small">120Ω</text>
    </g>
  </g>

  <!-- New GPIO led/button label connections -->
  <g id="new-links">
    <path class="wire2" d="M370 300 C395 300, 395 340, 410 340" />
    <text x="376" y="290" class="small">GPIO25</text>
    <path class="wire2" d="M370 320 C395 320, 395 360, 410 360" />
    <text x="376" y="310" class="small">GPIO26</text>
  </g>

  <!-- Notes -->
  <g id="notes" transform="translate(40,650)">
    <text x="0" y="0" class="label">Notatki:</text>
    <text x="0" y="22" class="note">- Żaden element zewnętrzny nie jest podłączony bezpośrednio do magistrali CAN, z wyjątkiem transceivera CAN.</text>
    <text x="0" y="44" class="note">- LED: GPIO25 przez R = 330Ω, katoda do GND.</text>
    <text x="0" y="66" class="note">- Przycisk: GPIO26 z pull-up 10kΩ do 3.3V, aktywny LOW po naciśnięciu.</text>
    <text x="0" y="88" class="note">- Wspólna masa ESP32, MCP2515 i transceiver jest obowiązkowa.</text>
    <text x="0" y="110" class="note">- Terminacja 120Ω na końcach magistrali CAN jest obowiązkowa w normalnym systemie CAN.</text>
  </g>
</svg>
